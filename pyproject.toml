[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-motion"
version = "0.1.0"
description = "An open foundation for pole movement catalogs, learning and games"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "jsonschema>=4.18"]

[project.optional-dependencies]
pose = ["mediapipe>=0.10,<1.0", "opencv-python-headless>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
pole-motion = "pole_motion.cli:main"

[tool.setuptools]
packages = ["pole_motion"]

[tool.setuptools.package-data]
pole_motion = ["*.json", "studio_web/*", "studio_web/vendor/*", "studio_web/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
